version: 2

project_name: terraviz

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: terraviz
    main: .
    binary: terraviz
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  prerelease: auto
  name_template: "v{{ .Version }}"

homebrew_casks:
  - name: terraviz
    binaries:
      - terraviz
    repository:
      owner: krishnaduttPanchagnula
      name: TerraViz
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/krishnaduttPanchagnula/TerraViz"
    description: "Cross-state Terraform dependencies and interactive architecture diagrams"
    caveats: >-
      If macOS blocks the binary, run:
      xattr -d com.apple.quarantine $(brew --prefix)/bin/terraviz
    commit_author:
      name: "github-actions[bot]"
      email: "github-actions[bot]@users.noreply.github.com"
    commit_msg_template: "chore(brew): update cask to {{ .Tag }}"
    skip_upload: auto
