<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TerraViz">
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#60a5fa" opacity="0.35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d1117"
        stroke="#2563eb" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="url(#grid)"/>

  <!-- Terraform state: stacked layers -->
  <rect x="8" y="23" width="13" height="4" rx="2" fill="#3b82f6"/>
  <rect x="8" y="30" width="13" height="4" rx="2" fill="#3b82f6" opacity="0.75"/>
  <rect x="8" y="37" width="13" height="4" rx="2" fill="#3b82f6" opacity="0.5"/>

  <!-- resolved dependency graph -->
  <g stroke="#93c5fd" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M21 27 L30 20"/>
    <path d="M39 27 L48 41"/>
    <path d="M35 27 L25 44"/>
  </g>

  <rect x="30" y="12" width="18" height="14" rx="3" fill="#3b82f6"
        stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="34" y="17" width="10" height="2" rx="1" fill="#dbeafe"/>
  <rect x="34" y="21" width="6" height="2" rx="1" fill="#dbeafe" opacity="0.8"/>

  <rect x="16" y="44" width="14" height="10" rx="3" fill="#60a5fa"
        stroke="#bfdbfe" stroke-width="1.2"/>
  <rect x="43" y="42" width="14" height="12" rx="3" fill="#22c55e"
        stroke="#bbf7d0" stroke-width="1.2"/>
</svg>
